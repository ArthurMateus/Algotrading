[project]
name = "algotrade"
version = "0.0.1"
description = "Tryout: is any algorithmic trading viable for a retail developer? Paper and backtest only."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algotrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
